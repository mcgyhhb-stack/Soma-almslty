<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 سومي أغلى حبيبة 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e, #ffafaf);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .love-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
            border: 10px solid #ff6b6b;
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .message {
            font-size: 1.8rem;
            color: #ff6b6b;
            margin: 20px 0;
            line-height: 1.5;
        }
        .heart {
            color: #ff6b6b;
            font-size: 3rem;
            animation: heartbeat 1.5s infinite;
            display: block;
            margin: 20px 0;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        .btn {
            background: #ff6b6b;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 1.2rem;
            margin: 10px;
            display: inline-block;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        .flowers {
            font-size: 2rem;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="love-card">
        <div class="flowers">🌸🌹💐🌷🌺</div>
        
        <h1>مرحباً يا حبيبتي سومي! 💖</h1>
        
        <div class="heart">❤️</div>
        
        <div class="message">
            أنتِ أغلى إنسانة في حياتي<br>
            وشمس أيامي ونور ليالي
        </div>
        
        <div class="heart">💝</div>
        
        <div class="message">
            أحبك أكثر من أي شيء في الدنيا<br>
            وأنتِ كل أحلامي التي تحققت
        </div>
        
        <div class="flowers">💕✨🌟🎀💘</div>
        
        <div style="margin-top: 30px;">
            <a href="love.html" class="btn">📝 رسالة حب خاصة</a>
            <a href="gallery.html" class="btn">🖼️ معرض ذكرياتنا</a>
        </div>
    </div>
    
    <script>
        // تأثيرات تفاعلية بسيطة
        document.addEventListener('DOMContentLoaded', function() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach(heart => {
                heart.addEventListener('click', function() {
                    this.style.transform = 'scale(1.5)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                    }, 300);
                });
            });
        });
    </script>
</body>
</html>
