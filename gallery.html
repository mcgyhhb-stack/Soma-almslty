<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖼️ ذكرياتنا 🖼️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .gallery {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            border: 8px solid #4facfe;
            color: #333;
        }
        h1 { color: #4facfe; font-size: 2.2rem; margin-bottom: 30px; }
        .memory { background: rgba(79, 172, 254, 0.1); padding: 20px; margin: 15px 0; border-radius: 15px; text-align: right; }
        .btn { background: #4facfe; color: white; padding: 12px 25px; text-decoration: none; border-radius: 20px; margin-top: 20px; display: inline-block; }
        .btn:hover { background: #3a9df7; }
    </style>
</head>
<body>
    <div class="gallery">
        <h1>🖼️ ذكرياتنا الجميلة 🖼️</h1>
        <div class="memory">
            <div style="font-size: 2rem;">🌟</div>
            <div style="font-size: 1.4rem; color: #4facfe; margin: 10px 0;">أول لقاء</div>
            <div>لحظة التقينا لأول مرة، بداية قصة حبنا</div>
        </div>
        <div class="memory">
            <div style="font-size: 2rem;">😊</div>
            <div style="font-size: 1.4rem; color: #4facfe; margin: 10px 0;">أول ابتسامة</div>
            <div>ابتسامتك التي سرقت قلبي</div>
        </div>
        <div class="memory">
            <div style="font-size: 2rem;">💝</div>
            <div style="font-size: 1.4rem; color: #4facfe; margin: 10px 0;">أول هدية</div>
            <div>تلك الهدية البسيطة التي كانت تعني العالم</div>
        </div>
        <a href="index.html" class="btn">العودة للصفحة الرئيسية 🏠</a>
    </div>
</body>
</html>
